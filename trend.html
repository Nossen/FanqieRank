<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>类型风向标 · 番茄新书榜</title>
  <meta name="description" content="按频道聚合番茄新书榜多日趋势、阅读增长、题材关键词和新上榜作品">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="trend-page">
  <main class="trend-shell">
    <header class="trend-topbar">
      <div>
        <a href="index.html" class="back-link">返回榜单</a>
        <h1>类型风向标</h1>
        <p id="trend-subtitle">加载中...</p>
      </div>
      <div class="range-control" id="trend-range">
        <button class="seg-btn active" data-days="7">7日</button>
        <button class="seg-btn" data-days="14">14日</button>
        <button class="seg-btn" data-days="30">30日</button>
        <button class="seg-btn" data-days="all">全部</button>
      </div>
    </header>

    <section class="market-board">
      <article class="summary-panel">
        <span class="panel-kicker">全站热点</span>
        <h2>当下火热赛道与题材</h2>
        <p id="market-summary">正在读取数据。</p>
        <small id="market-source">统计中</small>
      </article>
      <article class="list-panel">
        <span class="panel-kicker">综合赛道</span>
        <div id="hot-genre-list" class="hot-list"></div>
      </article>
      <article class="list-panel">
        <span class="panel-kicker">具体分类</span>
        <div id="hot-type-list" class="hot-list"></div>
      </article>
      <article class="list-panel">
        <span class="panel-kicker">高频题材</span>
        <div id="hot-theme-list" class="theme-cloud"></div>
      </article>
    </section>

    <section class="type-filter">
      <span class="panel-kicker">类型</span>
      <div id="trend-category-buttons" class="chip-row"></div>
    </section>

    <section class="trend-grid">
      <article class="trend-block">
        <span class="panel-kicker">新增在读</span>
        <h2>阅读增长焦点</h2>
        <div id="reads-list" class="compact-list"></div>
      </article>
      <article class="trend-block">
        <span class="panel-kicker">排名动能</span>
        <h2>上升作品</h2>
        <div id="risers-list" class="compact-list"></div>
      </article>
      <article class="trend-block">
        <span class="panel-kicker">新上榜</span>
        <h2>题材入口</h2>
        <div id="new-books-list" class="compact-list"></div>
      </article>
      <article class="trend-block trend-block-wide">
        <span class="panel-kicker">连续观察</span>
        <h2>每日风向摘要</h2>
        <div id="summary-feed" class="summary-feed"></div>
      </article>
    </section>
  </main>
  <script src="js/trend.js"></script>
</body>
</html>
