name: Daily Fanqie Male New Books

on:
  schedule:
    # Beijing time 16:10, after Fanqie rank data is expected to refresh.
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional report date in Asia/Shanghai, YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-male-new-books
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      INPUT_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Resolve report date
        id: report-date
        run: |
          if [ -n "$INPUT_DATE" ]; then
            report_date="$INPUT_DATE"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          echo "Report date: $report_date"
      - name: Collect raw rank data
        run: |
          report_date="${{ steps.report-date.outputs.date }}"
          if [ -f "data/raw/$report_date.json" ]; then
            echo "Raw data already exists for $report_date."
          else
            python -m fanqierank collect --date "$report_date" --timezone Asia/Shanghai --sleep-seconds 3
          fi
      - name: Fallback finalize
        run: python -m fanqierank fallback-finalize --date "${{ steps.report-date.outputs.date }}"
      - name: Verify
        run: |
          python -m compileall fanqierank tests
          pytest
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/latest_ranks.json").read_text(encoding="utf-8"))
          assert payload["categories"], "missing categories"
          assert payload["source"]["analysis"] == "Local heuristic fallback"
          print("schema-ok", payload["date"], len(payload["categories"]))
          PY
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data api reports
          git commit -m "chore: update Fanqie male ranks"
          git push || {
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          }
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
