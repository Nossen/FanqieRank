name: Manual Fanqie Collection Smoke Test

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date in Asia/Shanghai, YYYY-MM-DD. Defaults to today."
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-22.04
    env:
      INPUT_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Run collection smoke
        run: |
          if [ -n "$INPUT_DATE" ]; then
            report_date="$INPUT_DATE"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi
          python -m fanqierank collect --date "$report_date" --limit 1 --sleep-seconds 1 --output /tmp/fanqierank-smoke
